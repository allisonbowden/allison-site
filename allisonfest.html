<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>allisonfest - Allison</title>
  <link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="allisonfest.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <a class="back" href="projects.html">&larr; projects</a>

  <header>
    <p class="label">past projects</p>
    <svg class="fest-logo" viewBox="0 0 240 240" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <circle cx="120" cy="120" r="105" fill="#f2d688" stroke="#2e1308" stroke-width="3"/>
      <circle cx="120" cy="120" r="99" fill="none" stroke="#2e1308" stroke-width="1" opacity="0.35"/>

      <!-- woman: hat, sunglasses -->
      <path d="M72 74 C72 64 80 57 92 57 C104 57 112 64 112 74" fill="none" stroke="#2e1308" stroke-width="2" stroke-linecap="round"/>
      <path d="M64 62 C71 54 113 54 120 62" fill="none" stroke="#2e1308" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M84 51 C84 45 100 45 100 51" fill="none" stroke="#2e1308" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="85" cy="72" r="5" fill="none" stroke="#c65a4f" stroke-width="2"/>
      <circle cx="99" cy="72" r="5" fill="none" stroke="#c65a4f" stroke-width="2"/>
      <path d="M90 71 C91.3 70 92.7 70 94 71" fill="none" stroke="#c65a4f" stroke-width="2" stroke-linecap="round"/>
      <path d="M70 76 C67 84 66.5 92 68.5 99 M114 76 C117 84 117.5 92 115.5 99" fill="none" stroke="#2e1308" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>

      <!-- man: hat, mustache -->
      <path d="M128 74 C128 64 136 57 148 57 C160 57 168 64 168 74" fill="none" stroke="#2e1308" stroke-width="2" stroke-linecap="round"/>
      <path d="M120 62 C127 54 169 54 176 62" fill="none" stroke="#2e1308" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M139 51 C139 45 157 45 157 51" fill="none" stroke="#2e1308" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="140" cy="72" r="2" fill="#2e1308"/>
      <circle cx="156" cy="72" r="2" fill="#2e1308"/>
      <path d="M134 82 C138 79 143 84 148 80 C153 84 158 79 162 82 C158 87 152 88 148 85 C144 88 138 87 134 82 Z" fill="#2e1308" stroke="#2e1308" stroke-width="1" stroke-linejoin="round"/>

      <!-- small stars -->
      <path d="M55 68 L57 74 L63 74 L58 78 L60 84 L55 80 L50 84 L52 78 L47 74 L53 74 Z" fill="none" stroke="#c65a4f" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M188 68 L189.5 72.5 L194 72.5 L190.5 75.5 L192 80 L188 77.3 L184 80 L185.5 75.5 L182 72.5 L186.5 72.5 Z" fill="none" stroke="#c65a4f" stroke-width="1.4" stroke-linejoin="round"/>

      <!-- ALLISONFEST wordmark -->
      <text x="120" y="120" text-anchor="middle" font-family="Cutive Mono, monospace" font-weight="700" font-size="24" fill="#c65a4f" letter-spacing="0.5">ALLISON</text>
      <text x="120" y="147" text-anchor="middle" font-family="Cutive Mono, monospace" font-weight="700" font-size="24" fill="#c65a4f" letter-spacing="0.5">FEST</text>

      <!-- banner -->
      <path d="M50 168 L190 168 L176 176 L190 184 L50 184 L64 176 Z" fill="none" stroke="#2e1308" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="120" y="180" text-anchor="middle" font-family="Cutive Mono, monospace" font-size="10.5" fill="#2e1308" letter-spacing="0.5">30TH ANNIVERSARY</text>

      <!-- date -->
      <text x="120" y="202" text-anchor="middle" font-family="Cutive Mono, monospace" font-size="10" fill="#2e1308" opacity="0.75" letter-spacing="0.5">JAN 17 &middot; 2026</text>
    </svg>
    <h1>allisonfest</h1>
    <p class="intro">my 30th birthday party/music festival</p>
  </header>

  <div class="moments">

    <div class="moment">
      <div class="text">
        <a class="moment-link title-link" href="https://partiful.com/e/MpASDK0CbghXF8dYH8AB?c=dkXeD7G3" target="_blank" rel="noopener">
          view the invite
          <svg class="arrow" viewBox="0 0 20 20" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 16 C7 12.5 10 9.5 15 5" stroke="#c65a4f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <path d="M9.3 5.6 C11.3 5.2 13.4 5 15 5 C14.7 6.6 14.3 8.5 13.9 10.4" stroke="#c65a4f" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>

    <div class="moment">
      <div class="text">
        <span class="title">the look book</span>
        <div class="moment-photos">
          <img class="moment-photo" src="images/allisonfest-lookbook-moodboard.jpg"
               alt="AllisonFest lookbook moodboard: a collage of festival menswear outfit inspiration">
          <img class="moment-photo tilt-r" src="images/allisonfest-lookbook-moodboard-2.jpg"
               alt="AllisonFest lookbook moodboard: a collage of festival womenswear outfit inspiration">
        </div>
      </div>
    </div>

    <div class="moment">
      <div class="text">
        <span class="title">custom wristbands and tattoos</span>
        <div class="moment-photos">
          <img class="moment-photo" src="images/allisonfest-wristband.jpg"
               alt="Guest wearing a custom AllisonFest 30th anniversary wristband, blowing bubbles on the rooftop">
          <img class="moment-photo tilt-r" src="images/allisonfest-wristband-tattoo.jpg"
               alt="A guest's wristband and custom AllisonFest temporary tattoo on their arm">
        </div>
      </div>
    </div>

    <div class="moment">
      <div class="text">
        <span class="title">rave sprouts</span>
      </div>
    </div>

    <div class="moment">
      <div class="text">
        <span class="title">the decks</span>
        <img class="moment-photo" src="images/allisonfest-dj-table.jpg"
             alt="Friends dancing and hyping up the decks with a Pioneer DJ setup and disco lights at AllisonFest">
      </div>
    </div>

    <div class="moment">
      <div class="text">
        <span class="title">the lineup</span>
        <img class="moment-photo" src="images/allisonfest-lineup-poster.png" alt="AllisonFest 30th Anniversary festival lineup poster">
        <iframe class="moment-embed" title="AllisonFest playlist on Spotify"
                src="https://open.spotify.com/embed/playlist/3aZyClrRQK6zC7qdqh6Js7"
                height="352" frameborder="0" loading="lazy"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
      </div>
    </div>

    <div class="moment">
      <div class="text">
        <span class="title">iv drips &amp; wellness check-ins</span>
        <div class="moment-photos">
          <img class="moment-photo" src="images/allisonfest-medic-station.jpg"
               alt="The AllisonFest medic station set up on the rooftop with an IV bag, first aid supplies, and a MEDIC sign">
          <img class="moment-photo tilt-r" src="images/allisonfest-medic-form.jpg"
               alt="A joke medic check-in form on a clipboard, with questions like mental status exam and pain scale">
        </div>
      </div>
    </div>

    <div class="moment">
      <div class="text">
        <span class="title">vip section</span>
      </div>
    </div>

  </div>

  <div class="gallery">
    <p class="label">photos</p>
    <div class="gallery-grid">
      <div class="photo-slot filled">
        <img src="images/allisonfest-rooftop-view.jpg" alt="Sunset view of the Golden Gate Bridge from the AllisonFest rooftop">
      </div>
      <div class="photo-slot filled">
        <img src="images/allisonfest-crowd.jpg" alt="A big group of AllisonFest guests cheering on the rooftop at sunset">
      </div>
      <div class="photo-slot filled">
        <img src="images/allisonfest-friends.jpg" alt="Two friends smiling together on the rooftop with bubbles floating around them">
      </div>
      <div class="photo-slot"></div>
      <div class="photo-slot"></div>
      <div class="photo-slot"></div>
    </div>
    <p class="gallery-note">photos coming soon</p>
  </div>

</body>
</html>
