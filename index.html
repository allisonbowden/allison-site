    <!-- airplane → travel, sketchy hand-drawn style -->
    <a class="object plane" href="#" aria-label="travel (coming soon)" title="Coming soon">
      <svg viewBox="0 0 240 130" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <!-- fuselage: wobbly ink outline, paper fill -->
        <path d="M30 63 C33.5 50 51 42.5 73 40.5 C112 37.5 151 38.5 186 42 C200.5 44 213.5 51 224.5 60.5 C214.5 70.5 200.5 78 185 80.5 C149 84.5 109.5 85 73 82.5 C51 81 33 74.5 30 63 Z"
              fill="#faf7f0" stroke="#2e1308" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- second sketch pass, loose and lighter -->
        <path d="M35 67 C41 74.5 56 79.5 75 81 M122 83.5 C147 84 168 82.5 183 79.5 M40 52 C48 46 60 42.8 74 41.8"
              fill="none" stroke="#2e1308" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
        <!-- tail fin: open shape, doesn't quite close -->
        <path d="M56 42 C50.5 31.5 45.5 21 42.5 11.5 C52 17.5 62.5 28.5 69.5 41"
              fill="none" stroke="#2e1308" stroke-width="2.2" stroke-linecap="round"/>
        <!-- red scribble fill on tail, escaping the lines -->
        <path d="M46 20 C50.5 23 55 27.5 58.5 31.5 M44.5 15 C51 19.5 57.5 26.5 63 33.5 M49.5 27 C53.5 30.5 57 34.5 60.5 38.5 M53 35 C55.5 37 58 39.2 60.5 41.5"
              stroke="#c65a4f" stroke-width="1.7" fill="none" opacity="0.85" stroke-linecap="round"/>
        <!-- rear stabilizer -->
        <path d="M48.5 76.5 C41 84 34 90 27.5 95 C37.5 93 49 87 59 79.5"
              fill="none" stroke="#2e1308" stroke-width="2" stroke-linecap="round"/>
        <!-- main wing, sweeping down with overshoot -->
        <path d="M105 80.5 C96.5 93 89.5 104 83 113.5 C102 107 123.5 96.5 139.5 82.5"
              fill="none" stroke="#2e1308" stroke-width="2.3" stroke-linecap="round"/>
        <!-- wing hatching -->
        <path d="M98.5 92 C104.5 89 110.5 86 116 83.2 M94 100.5 C102 96.5 110.5 92 118.5 87.2 M90 108.5 C99.5 104 110 98.5 120 92"
              stroke="#2e1308" stroke-width="1" opacity="0.45" fill="none" stroke-linecap="round"/>
        <!-- cockpit windshield stroke -->
        <path d="M197.5 48.5 C203.5 52 209.5 56 214.5 60"
              fill="none" stroke="#2e1308" stroke-width="1.8" stroke-linecap="round"/>
        <!-- windows: hand circles that don't quite close, varied -->
        <g fill="none" stroke="#2e1308" stroke-width="1.6">
          <path d="M89.2 60.5 A3.1 3.1 0 1 1 87.6 57.7"/>
          <path d="M106 59.7 A2.9 2.9 0 1 0 104.8 62.4"/>
          <path d="M123.3 60.8 A3.2 3.2 0 1 1 121.5 57.9"/>
          <path d="M140 59.9 A2.8 2.8 0 1 0 138.9 62.5"/>
          <path d="M156.9 61 A3 3 0 1 1 155.2 58.1"/>
          <path d="M173.5 60 A2.85 2.85 0 1 0 172.4 62.6"/>
        </g>
        <!-- motion dashes trailing behind -->
        <path d="M10 52.5 C14.5 52 19 51.6 23 51.4 M8.5 64 C13.5 64 18.5 64.1 23.5 64.3 M11 75 C15.5 75.5 19.5 76 23.5 76.4"
              stroke="#2e1308" stroke-width="1.4" opacity="0.5" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="object-label">travel (coming soon)</span>
    </a>

    <!-- walking photo cutout -> hobbies -->
